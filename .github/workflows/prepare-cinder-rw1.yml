name: Prepare Cinder Shift RW1 release
on:
  push:
    branches: [codex/cinder-shift-rw1-publish-20261114]
    paths: [.github/workflows/prepare-cinder-rw1.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: kirillgoncharik-commits/web-games-nuts
          ref: d52853ed6b2d339d6015e64075dc93628cc482fa
          path: game-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact verified game source
        working-directory: game-source
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run art:check
          npm run integrate -- "$GITHUB_WORKSPACE"
      - name: Record release and update catalogue
        run: node release-rw1.mjs
      - name: Verify complete site
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Commit prepared static artifact
        run: |
          rm .github/workflows/prepare-cinder-rw1.yml release-rw1.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/games/cinder-shift public/games/index.html docs/cinder-shift-rw1-release.md .github/workflows/prepare-cinder-rw1.yml release-rw1.mjs
          git commit -m "Publish Cinder Shift 0.7.0-rw1.b3 verified campaign"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: cinder-rw1-production-candidate
          path: |
            public/games/cinder-shift/build-manifest.json
            docs/cinder-shift-rw1-release.md
